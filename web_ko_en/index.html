<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>한국어 논문 탐색기</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ko-styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">OFFLINE TRANSLATION / BM25</p>
        <h1 id="page-title">한→영 논문 탐색기</h1>
        <p class="intro">한국어 질의를 로컬 한→영 Transformer 모델로 전체 번역한 뒤, 영어 PDF 컬렉션을 BM25로 검색합니다.</p>
        <p class="privacy-note">외부 번역 API·LLM 호출 없이 이 컴퓨터의 로컬 번역 모델로만 처리합니다.</p>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="query">논문 검색</label>
          <input id="query" name="q" type="search" autocomplete="off" placeholder="예: 평형 전파를 사용하는 신경망 학습 방법" />
          <button type="submit">검색</button>
        </form>
        <div class="examples" aria-label="예시 검색어">
          <span>예시</span>
          <button type="button" data-query="평형 전파를 사용하는 신경망 학습 방법">평형 전파 신경망 학습</button>
          <button type="button" data-query="상 변화 메모리 기반 하드웨어">상 변화 메모리 하드웨어</button>
          <button type="button" data-query="노이즈가 많은 하드웨어에서 신경망 훈련">노이즈 하드웨어 훈련</button>
          <button type="button" data-query="noisy hardware">noisy hardware</button>
        </div>
      </section>

      <section class="content" aria-live="polite">
        <div class="results-header">
          <p id="result-summary">컬렉션 로딩 중</p>
          <p class="method-note">가중치: 제목 ×4 · 키워드 ×3 · 메타데이터 ×2 · 본문 ×1</p>
        </div>
        <p id="translation-result" class="translation-result" hidden></p>
        <div id="results" class="results"></div>
        <template id="result-template">
          <article class="result-card">
            <div class="card-topline">
              <span class="document-id"></span>
              <span class="score"></span>
            </div>
            <h2></h2>
            <p class="authors"></p>
            <p class="venue"></p>
            <p class="abstract"></p>
            <div class="tag-row keywords"></div>
            <div class="card-footer">
              <span class="match-info"></span>
              <a class="pdf-link" target="_blank" rel="noopener">PDF 열기 <span aria-hidden="true">↗</span></a>
            </div>
          </article>
        </template>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
