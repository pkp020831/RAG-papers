<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paper Search Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">RETRIEVAL TESTBED / BM25</p>
        <h1 id="page-title">논문 탐색기</h1>
        <p class="intro">로컬 PDF에서 추출한 메타데이터와 본문을 가중 BM25로 검색합니다.</p>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="query">논문 검색</label>
          <input id="query" name="q" type="search" autocomplete="off" placeholder="예: vector retrieval, MoS2, clinical NLP" />
          <button type="submit">검색</button>
        </form>
        <div class="examples" aria-label="예시 검색어">
          <span>예시</span>
          <button type="button" data-query="vector retrieval">vector retrieval</button>
          <button type="button" data-query="MoS2 growth">MoS2 growth</button>
          <button type="button" data-query="clinical timeline">clinical timeline</button>
          <button type="button" data-query="robot recovery">robot recovery</button>
        </div>
      </section>

      <section class="content" aria-live="polite">
        <div class="results-header">
          <p id="result-summary">전체 컬렉션 5편</p>
          <p class="method-note">가중치: 제목 ×4 · 키워드 ×3 · 메타데이터 ×2 · 본문 ×1</p>
        </div>
        <div id="results" class="results"></div>
        <template id="result-template">
          <article class="result-card">
            <div class="card-topline">
              <span class="document-id"></span>
              <span class="score"></span>
            </div>
            <h2></h2>
            <p class="authors"></p>
            <p class="venue"></p>
            <p class="abstract"></p>
            <div class="tag-row keywords"></div>
            <div class="card-footer">
              <span class="match-info"></span>
              <a class="pdf-link" target="_blank" rel="noopener">PDF 열기 <span aria-hidden="true">↗</span></a>
            </div>
          </article>
        </template>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
